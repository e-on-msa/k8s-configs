apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-svc

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: ai-svc

  template:
    metadata:
      labels:
        app: ai-svc

    spec:
      containers:
        - name: ai-svc
          image: eonmsa/ai-svc:latest