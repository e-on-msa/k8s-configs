apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eon-ingress

spec:
  rules:
    - http:
        paths:
          - path: /csrf-token
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: 8080

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: 8080

          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: challenge-svc
                port:
                  number: 8084

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
                  