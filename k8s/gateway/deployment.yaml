apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: gateway-svc

  template:
    metadata:
      labels:
        app: gateway-svc

    spec:
      containers:
        - name: gateway-svc
          image: eonmsa/gateway-svc:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret