apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway-svc

  template:
    metadata:
      labels:
        app: gateway-svc

    spec:
      containers:
        - name: gateway-svc
          image: eonmsa/gateway-svc:latest

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: REDIS_HOST
              value: redis

            - name: REDIS_PORT
              value: "6379"

            - name: USER_SERVICE_URL
              value: http://user-svc:8081

            - name: SCHEDULE_SERVICE_URL
              value: http://schedule-svc:8082

            - name: COMMUNITY_SERVICE_URL
              value: http://community-svc:8083

            - name: CHALLENGE_SERVICE_URL
              value: http://challenge-svc:8084

            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-svc:8085

            - name: AI_SERVICE_URL
              value: http://ai-svc:8086
              