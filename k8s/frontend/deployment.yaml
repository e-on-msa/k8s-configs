apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: eonmsa/frontend-svc:latest
          revisionHistoryLimit: 2

          ports:
            - containerPort: 5173

          envFrom:
            - configMapRef:
                name: frontend-config