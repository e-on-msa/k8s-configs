apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-svc

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: user-svc

  template:
    metadata:
      labels:
        app: user-svc

    spec:
      containers:
        - name: user-svc
          image: eonmsa/user-svc:v8

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-secret
