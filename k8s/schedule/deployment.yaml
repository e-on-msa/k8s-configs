apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-svc

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: schedule-svc

  template:
    metadata:
      labels:
        app: schedule-svc

    spec:
      containers:
        - name: schedule-svc
          image: eonmsa/schedule-svc:v8

          ports:
            - containerPort: 8082

          envFrom:
            - configMapRef:
                name: schedule-config
            - secretRef:
                name: schedule-secret